spring:
  application:
    name: ai-code-helper
  profiles:
    # 未显式指定 profile 时加载 local（真实密钥在 application-local.yml，已 gitignore）
    default: local
  datasource:
    url: jdbc:mysql://localhost:3306/ai_code_helper?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: ${MYSQL_PASSWORD:}
  sql:
    init:
      mode: always
milvus:
  host: localhost
  port: 19530
  # 换 embedding 模型必须换 collection（维度不同无法复用旧集合）
  collection-name: ai_code_helper_v2
  # 向量维度：bge-m3=1024（embo-01=1536，回滚时两项一起改回）
  dimension: 1024
server:
  port: 8081
  servlet:
    context-path: /api
zhipu:
  api-key: ${ZHIPU_API_KEY:}
  # OpenAI 兼容端点
  base-url: https://open.bigmodel.cn/api/paas/v4/
  # 免费模型；充值后可换回 glm-4.6
  chat-model: glm-4-flash
bigmodel:
  # MCP 联网搜索（按量计费；无余额时模型会收到搜索失败提示，不影响应用）
  api-key: ${ZHIPU_API_KEY:}
logging:
  level:
    # bigmodel.cn 空闲 60s 断连接，SSE 5s 默认读超时误判超时刷屏；调为 ERROR 只保留错误事件
    dev.langchain4j.mcp.client.transport.http.SseEventListener: ERROR
  pattern:
    # 把 traceId（由 TraceIdFilter 注入 MDC）打到每条日志里，便于整链路排查
    level: "%5p [traceId=%X{traceId:-}]"
  file:
    # 后台「日志」面板读这个文件；目录不存在时 Spring 会自动创建
    name: logs/app.log
    path: ./logs
minimax:
  api-key: ${MINIMAX_API_KEY:}
  base-url: https://api.minimaxi.com/v1
  embedding-model: embo-01
  # 备用对话模型：智谱挂了降级用（M2 会输出 <think> 思考块，后端自动剥离）
  chat-model: MiniMax-M2
llm:
  # 主聊天链路（AiCodeHelperService）失败降级到 MiniMax-M2
  failover-enabled: true
aliyun:
  oss:
    # 总开关；false 时 OssService 所有方法直接抛 IllegalStateException（前端上传/知识库管理会失败）
    enabled: false
    # 公网 endpoint：例 oss-cn-hangzhou.aliyuncs.com
    endpoint: ${OSS_ENDPOINT:}
    # 内网 endpoint（可选）：后端→OSS 走内网时填写，留空则与 endpoint 相同
    internal-endpoint: ${OSS_INTERNAL_ENDPOINT:}
    bucket: ${OSS_BUCKET:}
    access-key: ${OSS_AK:}
    secret-key: ${OSS_SK:}
    # 所有写入对象的根前缀（私有路径）
    key-prefix: uploads
    # 该前缀下对象公共读（图片/视频帧），前端 <img src> 直接可用
    public-prefix: public
    # 签名 URL 有效期（前端 PUT）
    presign-expire-seconds: 900
    # 签名 GET 有效期（私有对象的下载链接）
    download-expire-seconds: 3600
api:
  security:
    enabled: true
    # 调用方需携带 X-API-Key 请求头；生产用环境变量注入，未配置则全部拒绝
    api-key: ${APP_API_KEY:}
    # 管理员密钥：持有此 key 才能调 /api/rag/* 和 /api/admin/*；未配置则全部拒绝（fail-closed）
    admin-key: ${APP_ADMIN_KEY:}
  rate-limit:
    # 每 API Key 每分钟最大请求数
    requests-per-minute: 10
  sse:
    max-concurrent-per-ip: 5
siliconflow:
  api-key: ${SILICONFLOW_API_KEY:}
  base-url: https://api.siliconflow.cn/v1
  embedding-model: BAAI/bge-m3
  rerank-model: BAAI/bge-reranker-v2-m3
rag:
  # embedding 选择：siliconflow（bge-m3）| minimax（embo-01）
  embedding-provider: siliconflow
  # rerank 选择：siliconflow（bge-reranker）| llm（glm-4-flash 打分）
  rerank-provider: siliconflow
  # small-to-big 父块回送：检索用子块，送主 LLM 用父块
  parent-chunk-enabled: true
  parent-max-chars: 1000
  child-max-chars: 300
  # 向量召回 topK；越大 rerank 选择空间越大，embedding 调用也线性增加
  vector-top-k: 20
  # 向量召回最低 COSINE 分数，低于丢弃
  vector-min-score: 0.4
  # BM25 召回 topK
  bm25-top-k: 20
  # BM25 关键词召回开关（关掉即纯向量检索）
  bm25-enabled: true
  # Query 改写开关 + 变体数
  query-rewrite-enabled: true
  query-rewrite-variants: 3
  # 历史感知改写：传入最近 N 轮对话作为上下文（≤0 关闭）
  query-rewrite-history-turns: 2
  # HyDE（Hypothetical Document Embeddings）：让 LLM 生成假设答案再向量检索
  hyde-enabled: false
  # 重排序开关（关掉即按融合分直排）
  rerank-enabled: true
  rerank-min-candidates: 5
  # 上下文压缩开关（关掉即原段直送主 LLM）；逐段串行 LLM 调用延迟大且有损，默认关
  compress-enabled: false
  compress-max-chars: 200
  # 关键词权重（融合时），1 - keywordWeight 给向量
  keyword-weight: 0.3
  # 最终进入主 LLM 的段数
  final-top-k: 5
  # 综合分低于该值的段被丢弃（BM25 单路第一 ≈0.3，阈值必须低于它，否则硬词兜底全灭）
  final-min-score: 0.2
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      # actuator 不走 Spring MVC 的 CorsConfig（独立 handler mapping），必须单独配，
      # 否则监控面板直连 /api/actuator/prometheus 会再次被 CORS 拦截
      cors:
        allowed-origin-patterns: "*"
        allowed-methods: "*"
        allowed-headers: "*"
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ai-code-helper
